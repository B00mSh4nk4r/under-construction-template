<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Aptos', 'Aptos Display', Calibri, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0e5ec;
        }

        .card {
            background: #e0e5ec;
            border-radius: 30px;
            padding: 50px 40px;
            width: 520px;
            max-width: 94%;
            box-shadow: 10px 10px 30px #bec3cf, -10px -10px 30px #ffffff;
            text-align: center;
            transition: box-shadow 0.15s ease;
        }

        .icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #e0e5ec;
            box-shadow: 8px 8px 20px #bec3cf, -8px -8px 20px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon-circle i {
            font-size: 36px;
            color: #1a1a2e;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #0a0a1a;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        .description {
            font-size: 14px;
            color: #333;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 28px 0;
            font-size: 12px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #c8cdd8;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .countdown-item {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: #e0e5ec;
            box-shadow: inset 5px 5px 10px #bec3cf, inset -5px -5px 10px #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .countdown-item .num {
            font-size: 24px;
            font-weight: 700;
            color: #0a0a1a;
            line-height: 1;
        }

        .countdown-item .label {
            font-size: 10px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .neu-input {
            display: flex;
            align-items: center;
            background: #e0e5ec;
            border-radius: 15px;
            box-shadow: inset 8px 8px 16px #bec3cf, inset -8px -8px 16px #ffffff;
            padding: 0 18px;
            margin-bottom: 16px;
        }

        .neu-input .icon {
            color: #333;
            font-size: 16px;
            margin-right: 12px;
        }

        .neu-input input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 16px 0;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #0a0a1a;
        }

        .neu-input input::placeholder { color: #666; }

        .neu-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: #e0e5ec;
            box-shadow: 8px 8px 20px #bec3cf, -8px -8px 20px #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            color: #0a0a1a;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        .neu-btn:hover {
            box-shadow: 6px 6px 15px #bec3cf, -6px -6px 15px #ffffff;
        }

        .neu-btn:active {
            box-shadow: inset 4px 4px 10px #bec3cf, inset -4px -4px 10px #ffffff;
        }

        .msg {
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }

        .msg.ok {
            background: #d6ecd6;
            color: #2a7a2a;
            box-shadow: inset 3px 3px 6px #bdd4bd, inset -3px -3px 6px #efffef;
        }

        .msg.err {
            background: #f0dada;
            color: #a03030;
            box-shadow: inset 3px 3px 6px #d6c0c0, inset -3px -3px 6px #fef4f4;
        }

        .msg.show { display: block; }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #e0e5ec;
            box-shadow: 5px 5px 12px #bec3cf, -5px -5px 12px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 18px;
            text-decoration: none;
            transition: box-shadow 0.2s;
        }

        .social-btn:hover {
            box-shadow: 3px 3px 8px #bec3cf, -3px -3px 8px #ffffff;
            color: #0a0a1a;
        }

        .social-btn:active {
            box-shadow: inset 3px 3px 6px #bec3cf, inset -3px -3px 6px #ffffff;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #555;
        }

        @media (max-width: 460px) {
            .card { padding: 35px 24px; border-radius: 22px; }
            .countdown { gap: 10px; }
            .countdown-item { width: 58px; height: 58px; border-radius: 14px; }
            .countdown-item .num { font-size: 18px; }
            .title { font-size: 18px; }
            .subtitle { font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-circle">
        <i class="fa-solid fa-hammer"></i>
    </div>

    <h1 class="title">Website</h1>
    <p class="subtitle">Under Construction</p>
    <p class="description">We're working hard to bring you something amazing. Stay tuned and be the first to know when we launch!</p>

    <div class="divider">Launching In</div>

    <div class="countdown">
        <div class="countdown-item">
            <span class="num" id="days">00</span>
            <span class="label">Days</span>
        </div>
        <div class="countdown-item">
            <span class="num" id="hours">00</span>
            <span class="label">Hours</span>
        </div>
        <div class="countdown-item">
            <span class="num" id="mins">00</span>
            <span class="label">Mins</span>
        </div>
        <div class="countdown-item">
            <span class="num" id="secs">00</span>
            <span class="label">Secs</span>
        </div>
    </div>

    <div class="divider">Get Notified</div>

    <div id="msgOk" class="msg ok"></div>
    <div id="msgErr" class="msg err"></div>

    <div class="neu-input">
        <i class="fa-solid fa-envelope icon"></i>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
    </div>

    <button type="button" class="neu-btn" id="notifyBtn">Notify Me</button>

    <div class="social-links">
        <a href="#" class="social-btn"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-github"></i></a>
    </div>

    <div class="footer">&copy; 2026 All rights reserved.</div>
</div>

<script>
(function(){
    // Countdown — set your launch date here
    var launchDate = new Date('2026-05-01T00:00:00').getTime();

    function updateCountdown(){
        var now = Date.now();
        var diff = launchDate - now;
        if(diff < 0) diff = 0;

        var d = Math.floor(diff / (1000*60*60*24));
        var h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        var m = Math.floor((diff % (1000*60*60)) / (1000*60));
        var s = Math.floor((diff % (1000*60)) / 1000);

        document.getElementById('days').textContent = d < 10 ? '0'+d : d;
        document.getElementById('hours').textContent = h < 10 ? '0'+h : h;
        document.getElementById('mins').textContent = m < 10 ? '0'+m : m;
        document.getElementById('secs').textContent = s < 10 ? '0'+s : s;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Notify button
    var emailInput = document.getElementById('email');
    var notifyBtn = document.getElementById('notifyBtn');
    var msgOk = document.getElementById('msgOk');
    var msgErr = document.getElementById('msgErr');

    function hideMsg(el){ el.className = el.className.replace(' show',''); }
    function showMsg(el, txt){ el.textContent = txt; el.className = el.className.replace(' show','') + ' show'; }

    notifyBtn.onclick = function(){
        hideMsg(msgOk); hideMsg(msgErr);
        var email = emailInput.value.trim();
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
            showMsg(msgErr, 'Please enter a valid email address.');
            return;
        }
        notifyBtn.disabled = true;
        notifyBtn.textContent = 'Submitting...';
        // TODO: Replace with actual API call
        setTimeout(function(){
            notifyBtn.disabled = false;
            notifyBtn.textContent = 'Notify Me';
            emailInput.value = '';
            showMsg(msgOk, "You're on the list! We'll notify you when we launch.");
        }, 800);
    };

    emailInput.addEventListener('keydown', function(e){
        if(e.keyCode === 13) notifyBtn.click();
    });

    // Ambient light — card shadow follows cursor
    var card = document.querySelector('.card');
    document.addEventListener('mousemove', function(e){
        var rect = card.getBoundingClientRect();
        var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        var ax = (e.clientX - cx) / (rect.width/2);
        var ay = (e.clientY - cy) / (rect.height/2);
        var sx = ax * 30, sy = ay * 30;
        card.style.boxShadow = sx+'px '+sy+'px 60px #bec3cf, '+(-sx)+'px '+(-sy)+'px 60px #ffffff';
    });
})();
</script>

</body>
</html>

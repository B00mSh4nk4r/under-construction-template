<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Larenon</title>
    <link rel="shortcut icon" href="https://larenon.cuztomiseapp.com/pharma/img/icon16.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0e5ec;
        }

        .card {
            background: #e0e5ec;
            border-radius: 30px;
            padding: 50px 40px;
            width: 440px;
            max-width: 94%;
            box-shadow: 10px 10px 30px #bec3cf, -10px -10px 30px #ffffff;
            text-align: center;
            transition: box-shadow 0.15s ease;
        }

        .logo { height: 38px; margin-bottom: 10px; }

        .subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 30px;
        }

        .neu-input {
            display: flex;
            align-items: center;
            background: #e0e5ec;
            border-radius: 15px;
            box-shadow: inset 8px 8px 16px #bec3cf, inset -8px -8px 16px #ffffff;
            padding: 0 18px;
            margin-bottom: 22px;
        }

        .neu-input .icon {
            color: #555;
            font-size: 16px;
            margin-right: 12px;
        }

        .neu-input input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 16px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #1a1a2e;
        }

        .neu-input input::placeholder { color: #888; }

        .neu-input .change-link {
            color: #333;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }

        .neu-input .change-link:hover { color: #1a1a2e; }

        .neu-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: #e0e5ec;
            box-shadow: 8px 8px 20px #bec3cf, -8px -8px 20px #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        .neu-btn:hover {
            box-shadow: 6px 6px 15px #bec3cf, -6px -6px 15px #ffffff;
        }

        .neu-btn:active {
            box-shadow: inset 4px 4px 10px #bec3cf, inset -4px -4px 10px #ffffff;
        }

        .neu-btn:disabled {
            color: #888;
            cursor: not-allowed;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: #e0e5ec;
            box-shadow: 8px 8px 20px #bec3cf, -8px -8px 20px #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            cursor: pointer;
            transition: box-shadow 0.2s;
            margin-bottom: 8px;
        }

        .google-btn:hover {
            box-shadow: 6px 6px 15px #bec3cf, -6px -6px 15px #ffffff;
        }

        .google-btn:active {
            box-shadow: inset 4px 4px 10px #bec3cf, inset -4px -4px 10px #ffffff;
        }

        .google-btn svg { width: 18px; height: 18px; }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
            font-size: 11px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #c8cdd8;
        }

        .otp-row {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }

        .otp-row input {
            width: 0;
            flex: 1;
            min-width: 0;
            height: 50px;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #e0e5ec;
            box-shadow: inset 5px 5px 10px #bec3cf, inset -5px -5px 10px #ffffff;
            -moz-appearance: textfield;
        }

        .otp-row input::-webkit-outer-spin-button,
        .otp-row input::-webkit-inner-spin-button { -webkit-appearance: none; }

        .otp-row input:focus {
            box-shadow: inset 5px 5px 10px #b0b5c3, inset -5px -5px 10px #ffffff;
        }

        .info-text {
            font-size: 12px;
            color: #555;
            margin-bottom: 18px;
            text-align: left;
        }

        .msg {
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }

        .msg.err {
            background: #f0dada;
            color: #a03030;
            box-shadow: inset 3px 3px 6px #d6c0c0, inset -3px -3px 6px #fef4f4;
        }

        .msg.ok {
            background: #d6ecd6;
            color: #2a7a2a;
            box-shadow: inset 3px 3px 6px #bdd4bd, inset -3px -3px 6px #efffef;
        }

        .msg.show { display: block; }

        .resend {
            margin-top: 14px;
            font-size: 13px;
            color: #555;
        }

        .resend a {
            color: #333;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .resend a:hover { color: #1a1a2e; }
        .resend a.off { color: #999; pointer-events: none; }

        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: #888;
        }

        .success-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0 20px;
        }

        .success-overlay.show { display: flex; }

        .check-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e0e5ec;
            box-shadow: 8px 8px 20px #bec3cf, -8px -8px 20px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .check-circle svg { width: 36px; height: 36px; }

        .check-circle .check-path {
            stroke: #2a7a2a;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.5s 0.2s ease forwards;
        }

        .success-text {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .success-sub { font-size: 12px; color: #555; }

        @keyframes drawCheck { to { stroke-dashoffset: 0; } }

        .locked-msg {
            font-size: 13px;
            color: #a03030;
            padding: 14px;
            border-radius: 12px;
            background: #e0e5ec;
            box-shadow: inset 5px 5px 10px #bec3cf, inset -5px -5px 10px #ffffff;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .locked-msg.show { display: block; }

        .attempts-left {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            text-align: center;
        }

        .hide { display: none !important; }

        @media (max-width: 460px) {
            .card { padding: 35px 24px; border-radius: 22px; }
            .otp-row { gap: 6px; }
            .otp-row input { height: 44px; font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="card">
    <img class="logo" src="https://larenon.cuztomiseapp.com/pharma/img/logo.png" alt="Cuztomise" />
    <p class="subtitle">Please sign in to continue</p>

    <div id="s1">
        <button type="button" class="google-btn" id="gBtn">
            <svg viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>

        <div class="divider">OR</div>

        <div id="e1" class="msg err"></div>

        <div class="neu-input">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" id="em" placeholder="Email address" autocomplete="email" />
        </div>

        <button type="button" class="neu-btn" id="sendBtn">Send OTP</button>
    </div>

    <div id="s2" class="hide">
        <div class="neu-input">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" id="emRo" readonly />
            <a class="change-link" id="chg">Change</a>
        </div>

        <p class="info-text">A 6-digit code was sent to your email.</p>

        <div id="e2" class="msg err"></div>
        <div id="o2" class="msg ok"></div>

        <div class="otp-row" id="otp">
            <input type="number" maxlength="1" data-i="0" />
            <input type="number" maxlength="1" data-i="1" />
            <input type="number" maxlength="1" data-i="2" />
            <input type="number" maxlength="1" data-i="3" />
            <input type="number" maxlength="1" data-i="4" />
            <input type="number" maxlength="1" data-i="5" />
        </div>

        <div id="lockMsg" class="locked-msg">Too many failed attempts. Please request a new code.</div>

        <button type="button" class="neu-btn" id="verBtn" disabled>Verify & Sign In</button>

        <div id="attemptsInfo" class="attempts-left"></div>

        <div class="resend">
            Didn't get it? <a id="resBtn" class="off">Resend <span id="cd">(30s)</span></a>
        </div>
    </div>

    <div id="s3" class="success-overlay">
        <div class="check-circle">
            <svg viewBox="0 0 40 40"><path class="check-path" d="M10 20 L17 27 L30 13" /></svg>
        </div>
        <p class="success-text">Verified!</p>
        <p class="success-sub">Redirecting to your dashboard...</p>
    </div>

    <div class="footer">&copy; Cuztomise Technologies</div>
</div>

<script>
(function(){
    var s1=document.getElementById('s1'), s2=document.getElementById('s2'), s3=document.getElementById('s3'),
        em=document.getElementById('em'), otp=document.querySelectorAll('#otp input'),
        t=null, email='', attempts=0, maxAttempts=3;

    function getOtp(){ var v=''; for(var i=0;i<6;i++) v+=(otp[i].value||''); return v; }
    function clearOtp(){ for(var i=0;i<6;i++) otp[i].value=''; document.getElementById('verBtn').disabled=true; }
    function showMsg(id,txt){ var el=document.getElementById(id); el.textContent=txt; el.className=el.className.replace(' show','')+' show'; }
    function hideMsg(id){ document.getElementById(id).className=document.getElementById(id).className.replace(' show',''); }

    function timer(){
        var s=30, r=document.getElementById('resBtn'), c=document.getElementById('cd');
        r.className='off'; c.textContent='('+s+'s)';
        if(t) clearInterval(t);
        t=setInterval(function(){
            s--;
            if(s<=0){ clearInterval(t); r.className=''; c.textContent=''; }
            else c.textContent='('+s+'s)';
        },1000);
    }

    for(var i=0;i<6;i++){
        (function(idx){
            otp[idx].addEventListener('input',function(){
                if(this.value.length>1) this.value=this.value.slice(-1);
                if(this.value && idx<5) otp[idx+1].focus();
                document.getElementById('verBtn').disabled=getOtp().length!==6;
            });
            otp[idx].addEventListener('keydown',function(e){
                if(e.keyCode===8 && !this.value && idx>0){ otp[idx-1].value=''; otp[idx-1].focus(); }
                if(e.keyCode===37 && idx>0){ e.preventDefault(); otp[idx-1].focus(); }
                if(e.keyCode===39 && idx<5){ e.preventDefault(); otp[idx+1].focus(); }
            });
        })(i);
    }
    otp[0].addEventListener('paste',function(e){
        var d=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
        if(d.length>=6){ e.preventDefault(); for(var i=0;i<6;i++) otp[i].value=d[i]; otp[5].focus(); document.getElementById('verBtn').disabled=false; }
    });

    document.getElementById('gBtn').onclick=function(){
        // TODO: window.location.href = '/auth/google';
        alert('Connect Google OAuth endpoint here.');
    };

    document.getElementById('sendBtn').onclick=function(){
        hideMsg('e1');
        email=em.value.trim();
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
            showMsg('e1','Please enter a valid email address.'); return;
        }
        this.disabled=true; this.textContent='Sending...';
        var btn=this;
        // TODO: $.post('/api/auth/send-otp', { email: email }, function(){ goStep2(); });
        setTimeout(function(){
            btn.disabled=false; btn.textContent='Send OTP';
            goStep2();
        },800);
    };

    em.addEventListener('keydown',function(e){ if(e.keyCode===13) document.getElementById('sendBtn').click(); });

    function goStep2(){
        document.getElementById('emRo').value=email;
        clearOtp(); hideMsg('e2'); hideMsg('o2');
        attempts=0; updateAttempts();
        document.getElementById('lockMsg').classList.remove('show');
        s1.classList.add('hide'); s2.classList.remove('hide');
        timer();
        setTimeout(function(){ otp[0].focus(); },50);
    }

    function updateAttempts(){
        var el=document.getElementById('attemptsInfo');
        if(attempts>0 && attempts<maxAttempts) el.textContent=(maxAttempts-attempts)+' attempt'+(maxAttempts-attempts>1?'s':'')+' remaining';
        else el.textContent='';
    }

    function lockOut(){
        document.getElementById('lockMsg').classList.add('show');
        document.getElementById('verBtn').disabled=true;
        for(var i=0;i<6;i++){ otp[i].disabled=true; }
        document.getElementById('attemptsInfo').textContent='';
    }

    function unlockOtp(){
        document.getElementById('lockMsg').classList.remove('show');
        for(var i=0;i<6;i++){ otp[i].disabled=false; }
    }

    function showSuccess(){
        s2.classList.add('hide');
        s3.classList.add('show');
        // TODO: redirect after animation
        // setTimeout(function(){ window.location.href = '/pharma/dashboard'; }, 2000);
    }

    document.getElementById('chg').onclick=function(){
        if(t) clearInterval(t);
        s2.classList.add('hide'); s1.classList.remove('hide');
        em.focus();
    };

    document.getElementById('verBtn').onclick=function(){
        hideMsg('e2'); hideMsg('o2');
        if(getOtp().length!==6) return;
        this.disabled=true; this.textContent='Verifying...';
        var btn=this;
        // TODO: Replace with actual API call
        // $.post('/api/auth/verify-otp', { email: email, otp: getOtp() }, function(res){
        //     showSuccess();
        //     setTimeout(function(){ window.location.href = '/pharma/dashboard'; }, 2000);
        // }, function(err){
        //     attempts++;
        //     updateAttempts();
        //     if(attempts >= maxAttempts){ lockOut(); }
        //     else { showMsg('e2','Invalid code. Please try again.'); clearOtp(); otp[0].focus(); }
        //     btn.disabled=false; btn.innerHTML='Verify &amp; Sign In';
        // });
        setTimeout(function(){
            btn.disabled=false; btn.innerHTML='Verify &amp; Sign In';
            showSuccess();
        },800);
    };

    otp[5].addEventListener('keydown',function(e){ if(e.keyCode===13 && getOtp().length===6) document.getElementById('verBtn').click(); });

    document.getElementById('resBtn').onclick=function(){
        if(this.className==='off') return;
        hideMsg('e2'); clearOtp();
        attempts=0; updateAttempts(); unlockOtp();
        showMsg('o2','New code sent.');
        timer(); otp[0].focus();
    };

    // Ambient light — card shadow follows cursor
    var card=document.querySelector('.card');
    document.addEventListener('mousemove',function(e){
        var rect=card.getBoundingClientRect();
        var cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
        var ax=(e.clientX-cx)/(rect.width/2);
        var ay=(e.clientY-cy)/(rect.height/2);
        var sx=ax*30, sy=ay*30;
        card.style.boxShadow=sx+'px '+sy+'px 60px #bec3cf, '+(-sx)+'px '+(-sy)+'px 60px #ffffff';
    });
})();
</script>

</body>
</html>
